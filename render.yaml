services:
  - type: web
    name: zensciences-budget
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ZENBUDGET_HTTPS_ONLY
        value: "1"
      - key: ZENBUDGET_DB
        value: /var/data/zenbudget.db
    disk:
      name: zenbudget-data
      mountPath: /var/data
      sizeGB: 1
